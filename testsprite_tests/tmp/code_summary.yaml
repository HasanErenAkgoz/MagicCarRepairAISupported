version: "2"
type: backend
tech_stack:
  - C#
  - ASP.NET Core 10
  - PostgreSQL
  - Entity Framework Core
  - MediatR
  - JWT Bearer
  - SignalR
features:
  - name: Health Check
    description: Liveness endpoint for load balancers and monitoring
    files:
      - Core.Packages.WebAPI/Program.cs
    endpoints:
      - method: GET
        path: /health
        description: Returns healthy status when API is up
        auth_required: false
        response_schema:
          "200": Healthy
    depends_on: []
  - name: Authentication
    description: Login, registration, password reset, 2FA, refresh tokens, impersonation
    files:
      - Core.Packages.WebAPI/Controllers/AuthController.cs
    endpoints:
      - method: POST
        path: /api/Auth/login
        description: Login with email and password; returns IDataResult with JWT under data.token and user under data.user
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
        response_schema:
          "200": "{ success, message, data: { token, refreshToken, user } }"
          "400": Validation error
      - method: POST
        path: /api/Auth/register
        description: Register new user account
        auth_required: false
        response_schema:
          "200": RegisterResponse
          "400": Validation error
      - method: POST
        path: /api/Auth/refresh-token
        description: Refresh JWT using refresh token
        auth_required: false
        response_schema:
          "200": TokenResponse
      - method: POST
        path: /api/Auth/forgot-password
        description: Initiate password reset flow
        auth_required: false
        response_schema:
          "200": Success
    depends_on: []
  - name: Customers Management
    description: CRUD and import/export for shop customers
    files:
      - Core.Packages.WebAPI/Controllers/CustomersController.cs
    endpoints:
      - method: GET
        path: /api/Customers
        description: List customers with pagination and filters
        auth_required: true
        response_schema:
          "200": CustomerList
          "403": Forbidden for wrong role
      - method: GET
        path: /api/Customers/{id}
        description: Get customer by id
        auth_required: true
        response_schema:
          "200": Customer
          "404": Not found
      - method: POST
        path: /api/Customers
        description: Create new customer
        auth_required: true
        response_schema:
          "200": Customer
      - method: PUT
        path: /api/Customers/{id}
        description: Update customer
        auth_required: true
        response_schema:
          "200": Customer
      - method: DELETE
        path: /api/Customers/{id}
        description: Delete customer
        auth_required: true
        response_schema:
          "200": Success
    depends_on:
      - Authentication
  - name: Parts Inventory
    description: Parts catalog, stock, barcodes, import/export, bulk delete
    files:
      - Core.Packages.WebAPI/Controllers/PartsController.cs
    endpoints:
      - method: GET
        path: /api/Parts
        description: List parts with search and pagination
        auth_required: true
        response_schema:
          "200": PartList
      - method: GET
        path: /api/Parts/{id}
        description: Get part by id
        auth_required: true
        response_schema:
          "200": Part
      - method: POST
        path: /api/Parts
        description: Create new part
        auth_required: true
        response_schema:
          "200": Part
      - method: GET
        path: /api/Parts/low-stock
        description: List parts below minimum stock
        auth_required: true
        response_schema:
          "200": PartList
      - method: POST
        path: /api/Parts/bulk-delete
        description: Delete multiple parts by ids
        auth_required: true
        response_schema:
          "200": BulkDeleteResult
    depends_on:
      - Authentication
  - name: Work Orders
    description: Service work orders lifecycle, items, labor, photos, approvals
    files:
      - Core.Packages.WebAPI/Controllers/WorkOrdersController.cs
    endpoints:
      - method: GET
        path: /api/WorkOrders
        description: List work orders
        auth_required: true
        response_schema:
          "200": WorkOrderList
      - method: GET
        path: /api/WorkOrders/{id}
        description: Get work order details
        auth_required: true
        response_schema:
          "200": WorkOrder
      - method: POST
        path: /api/WorkOrders
        description: Create work order
        auth_required: true
        response_schema:
          "200": WorkOrder
      - method: POST
        path: /api/WorkOrders/{id}/status
        description: Update work order status
        auth_required: true
        response_schema:
          "200": WorkOrder
      - method: GET
        path: /api/WorkOrders/pending-approvals
        description: List work orders awaiting approval
        auth_required: true
        response_schema:
          "200": WorkOrderList
    depends_on:
      - Authentication
      - Customers Management
  - name: Vehicles
    description: Customer vehicles CRUD and photos
    files:
      - Core.Packages.WebAPI/Controllers/VehiclesController.cs
    endpoints:
      - method: GET
        path: /api/Vehicles
        description: List vehicles
        auth_required: true
        response_schema:
          "200": VehicleList
      - method: POST
        path: /api/Vehicles
        description: Create vehicle
        auth_required: true
        response_schema:
          "200": Vehicle
      - method: GET
        path: /api/Vehicles/customer/{customerId}
        description: List vehicles for customer
        auth_required: true
        response_schema:
          "200": VehicleList
    depends_on:
      - Authentication
  - name: Employees
    description: Shop employee management and QR codes
    files:
      - Core.Packages.WebAPI/Controllers/EmployeesController.cs
    endpoints:
      - method: GET
        path: /api/Employees
        description: List employees
        auth_required: true
        response_schema:
          "200": EmployeeList
      - method: POST
        path: /api/Employees
        description: Create employee
        auth_required: true
        response_schema:
          "200": Employee
    depends_on:
      - Authentication
  - name: Dashboard
    description: Shop dashboard metrics and charts
    files:
      - Core.Packages.WebAPI/Controllers/DashboardController.cs
    endpoints:
      - method: GET
        path: /api/Dashboard/stats
        description: Dashboard summary metrics
        auth_required: true
        response_schema:
          "200": DashboardStats
    depends_on:
      - Authentication
  - name: Invoices
    description: Invoice creation and status from work orders
    files:
      - Core.Packages.WebAPI/Controllers/InvoicesController.cs
    endpoints:
      - method: GET
        path: /api/Invoices/{id}
        description: Get invoice by id
        auth_required: true
        response_schema:
          "200": Invoice
      - method: POST
        path: /api/Invoices
        description: Create invoice
        auth_required: true
        response_schema:
          "200": Invoice
    depends_on:
      - Authentication
      - Work Orders
  - name: Accounting
    description: Income, expenses, taxes, salary payments, reports
    files:
      - Core.Packages.WebAPI/Controllers/IncomesController.cs
      - Core.Packages.WebAPI/Controllers/ExpensesController.cs
      - Core.Packages.WebAPI/Controllers/AccountingReportsController.cs
    endpoints:
      - method: GET
        path: /api/Incomes
        description: List income records
        auth_required: true
        response_schema:
          "200": IncomeList
      - method: GET
        path: /api/Expenses
        description: List expense records
        auth_required: true
        response_schema:
          "200": ExpenseList
      - method: GET
        path: /api/AccountingReports/cash-flow
        description: Cash flow report
        auth_required: true
        response_schema:
          "200": CashFlowReport
    depends_on:
      - Authentication
  - name: Quote Requests
    description: Customer quote requests and shop responses
    files:
      - Core.Packages.WebAPI/Controllers/QuoteRequestsController.cs
    endpoints:
      - method: GET
        path: /api/quote-requests/open
        description: List open quote requests for shop
        auth_required: true
        response_schema:
          "200": QuoteRequestList
      - method: POST
        path: /api/quote-requests
        description: Create quote request
        auth_required: true
        response_schema:
          "200": QuoteRequest
    depends_on:
      - Authentication
  - name: Customer Portal
    description: End-customer self-service portal APIs
    files:
      - Core.Packages.WebAPI/Controllers/CustomerPortalController.cs
    endpoints:
      - method: GET
        path: /api/customer-portal/work-orders
        description: List work orders for logged-in customer
        auth_required: true
        response_schema:
          "200": WorkOrderList
      - method: GET
        path: /api/customer-portal/profile
        description: Get customer profile
        auth_required: true
        response_schema:
          "200": CustomerProfile
    depends_on:
      - Authentication
  - name: AI Assistant
    description: AI chat, diagnosis, stock forecast (Mock provider in dev)
    files:
      - Core.Packages.WebAPI/Controllers/AIController.cs
    endpoints:
      - method: POST
        path: /api/AI/chat
        description: AI chat completion
        auth_required: true
        response_schema:
          "200": ChatResponse
      - method: POST
        path: /api/AI/diagnose
        description: Vehicle diagnosis from symptoms
        auth_required: true
        response_schema:
          "200": DiagnosisResponse
    depends_on:
      - Authentication
  - name: Appointments
    description: Service appointment scheduling
    files:
      - Core.Packages.WebAPI/Controllers/AppointmentsController.cs
    endpoints:
      - method: GET
        path: /api/Appointments
        description: List appointments
        auth_required: true
        response_schema:
          "200": AppointmentList
      - method: POST
        path: /api/Appointments
        description: Create appointment
        auth_required: true
        response_schema:
          "200": Appointment
    depends_on:
      - Authentication
  - name: Notifications
    description: In-app and push notifications
    files:
      - Core.Packages.WebAPI/Controllers/NotificationsController.cs
    endpoints:
      - method: GET
        path: /api/Notifications/my-notifications
        description: List notifications for current user
        auth_required: true
        response_schema:
          "200": NotificationList
      - method: POST
        path: /api/Notifications/{id}/read
        description: Mark notification as read
        auth_required: true
        response_schema:
          "200": Success
    depends_on:
      - Authentication
known_limitations:
  - issue: Most endpoints require JWT and role-based permissions; customer role gets 403 on shop endpoints
    location: Core.Packages.WebAPI/Controllers
    impact: Tests must login as admin@magiccar.com (SystemAdmin) for broad API coverage
  - issue: Multi-tenant data isolation via ClientId; empty shop may return empty lists
    location: Core.Packages.Persistence
    impact: Some list endpoints return 200 with empty arrays without seed data beyond bootstrap admin
  - issue: External payment and SMS providers may be disabled in development
    location: Core.Packages.Infrastructure
    impact: Payment and messaging endpoints may return errors or no-ops when not configured
