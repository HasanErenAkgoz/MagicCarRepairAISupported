name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magiccar
          POSTGRES_PASSWORD: magiccar_dev
          POSTGRES_DB: MagicCarRepairDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magiccar -d MagicCarRepairDb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore Core.Packages.WebAPI/MagicCarRepairAISupported.WebAPI.csproj
          dotnet restore Core.Packages.Application.Tests/MagicCarRepairAISupported.Application.Tests.csproj
          dotnet restore Core.Packages.WebAPI.Tests/MagicCarRepairAISupported.WebAPI.Tests.csproj

      - name: Build
        run: |
          dotnet build Core.Packages.Application.Tests/MagicCarRepairAISupported.Application.Tests.csproj -c Release --no-restore
          dotnet build Core.Packages.WebAPI.Tests/MagicCarRepairAISupported.WebAPI.Tests.csproj -c Release --no-restore

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=MagicCarRepairDb;Username=magiccar;Password=magiccar_dev
          TokenOptions__SecurityKey: TestSigningKeyForIntegrationTests_MustBe32Chars!!
          TokenOptions__Issuer: MagicCarRepair
          TokenOptions__Audience: MagicCarRepair.API
        run: |
          dotnet test Core.Packages.Application.Tests/MagicCarRepairAISupported.Application.Tests.csproj -c Release --no-build
          dotnet test Core.Packages.WebAPI.Tests/MagicCarRepairAISupported.WebAPI.Tests.csproj -c Release --no-build

  api-module-tests:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magiccar
          POSTGRES_PASSWORD: magiccar_dev
          POSTGRES_DB: MagicCarRepairDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magiccar -d MagicCarRepairDb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore and publish API
        run: |
          dotnet restore Core.Packages.WebAPI/MagicCarRepairAISupported.WebAPI.csproj
          dotnet publish Core.Packages.WebAPI/MagicCarRepairAISupported.WebAPI.csproj -c Release -o ./api-publish --no-restore

      - name: Start API and run module tests
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5169
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=MagicCarRepairDb;Username=magiccar;Password=magiccar_dev
          TokenOptions__SecurityKey: TestSigningKeyForIntegrationTests_MustBe32Chars!!
          TokenOptions__Issuer: MagicCarRepair
          TokenOptions__Audience: MagicCarRepair.API
          AIOptions__Provider: Mock
          TEST_API_BASE_URL: http://localhost:5169
        run: |
          ./api-publish/MagicCarRepairAISupported.WebAPI &
          echo $! > api.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5169/health | grep -q Healthy; then
              echo "API ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5169/health | grep -q Healthy
          pip install -r testsprite_tests/requirements.txt
          cd testsprite_tests && python run_all_modules.py
          kill $(cat ../api.pid) || true
