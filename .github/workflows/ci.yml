name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magiccar
          POSTGRES_PASSWORD: magiccar_dev
          POSTGRES_DB: MagicCarRepairDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magiccar -d MagicCarRepairDb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore Core.Packages.WebAPI/MagicCarRepairAISupported.WebAPI.csproj
          dotnet restore Core.Packages.Application.Tests/MagicCarRepairAISupported.Application.Tests.csproj
          dotnet restore Core.Packages.WebAPI.Tests/MagicCarRepairAISupported.WebAPI.Tests.csproj

      - name: Build
        run: |
          dotnet build Core.Packages.Application.Tests/MagicCarRepairAISupported.Application.Tests.csproj -c Release --no-restore
          dotnet build Core.Packages.WebAPI.Tests/MagicCarRepairAISupported.WebAPI.Tests.csproj -c Release --no-restore

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=MagicCarRepairDb;Username=magiccar;Password=magiccar_dev
          TokenOptions__SecurityKey: TestSigningKeyForIntegrationTests_MustBe32Chars!!
          TokenOptions__Issuer: MagicCarRepair
          TokenOptions__Audience: MagicCarRepair.API
        run: |
          dotnet test Core.Packages.Application.Tests/MagicCarRepairAISupported.Application.Tests.csproj -c Release --no-build
          dotnet test Core.Packages.WebAPI.Tests/MagicCarRepairAISupported.WebAPI.Tests.csproj -c Release --no-build

  api-module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magiccar
          POSTGRES_PASSWORD: magiccar_dev
          POSTGRES_DB: MagicCarRepairDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magiccar -d MagicCarRepairDb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore and publish API
        run: |
          dotnet restore Core.Packages.WebAPI/MagicCarRepairAISupported.WebAPI.csproj
          dotnet publish Core.Packages.WebAPI/MagicCarRepairAISupported.WebAPI.csproj -c Release -o ./api-publish --no-restore

      - name: Start API and run module tests
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5169
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=MagicCarRepairDb;Username=magiccar;Password=magiccar_dev
          TokenOptions__SecurityKey: TestSigningKeyForIntegrationTests_MustBe32Chars!!
          TokenOptions__Issuer: MagicCarRepair
          TokenOptions__Audience: MagicCarRepair.API
          AIOptions__Provider: Mock
          TEST_API_BASE_URL: http://localhost:5169
        run: |
          ./api-publish/MagicCarRepairAISupported.WebAPI &
          echo $! > api.pid
          cleanup() {
            if [ -f api.pid ]; then
              kill "$(cat api.pid)" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5169/health | grep -q Healthy; then
              echo "API ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5169/health | grep -q Healthy
          PGPASSWORD=magiccar_dev psql -h localhost -p 5432 -U magiccar -d MagicCarRepairDb -tAc \
            "SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '20260808120000_AddAiDiagnosisMediaAssets'" | grep -qx 1
          pip install -r testsprite_tests/requirements.txt
          cd testsprite_tests && python run_all_modules.py

  configuration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate production configuration template
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("Core.Packages.WebAPI/appsettings.Example.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          required_sections = {
              "ConnectionStrings", "Cors", "TokenOptions", "AIOptions",
              "Redis", "EmailSettings", "Iyzico", "SuperPassword",
          }
          missing = sorted(required_sections - set(config))
          if missing:
              raise SystemExit(f"Missing required configuration sections: {', '.join(missing)}")
          if config["SuperPassword"].get("Enabled") is not False:
              raise SystemExit("SuperPassword must be disabled in the committed template")
          if not config["ConnectionStrings"].get("DefaultConnection"):
              raise SystemExit("DefaultConnection must be documented in the template")
          if "Include Error Detail=true" in config["ConnectionStrings"]["DefaultConnection"]:
              raise SystemExit("Production template must not enable PostgreSQL error detail")
          if not config["TokenOptions"].get("SecurityKey"):
              raise SystemExit("TokenOptions:SecurityKey must be documented in the template")
          print("Configuration template contract is valid.")
          PY

  production-readiness-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify protected AI routes and untracked runtime uploads
        run: python3 scripts/verify_production_readiness.py
