<!DOCTYPE html>

<html class="light dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bağlantı Sorunu - Auto Service App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3c83f6",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 justify-between sticky top-0 z-10">
<div class="text-primary flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-3xl">close</span>
</div>
<div class="flex-1 text-center">
<h1 class="text-[#0d131c] dark:text-white text-sm font-semibold">Durum</h1>
</div>
<div class="size-12"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6">
<!-- EmptyState Style Illustration Container -->
<div class="flex flex-col items-center gap-8 w-full max-w-md">
<!-- Minimalist Blue Illustration -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Decorative background circles -->
<div class="absolute inset-0 bg-primary/10 dark:bg-primary/20 rounded-full animate-pulse"></div>
<div class="absolute inset-8 bg-primary/5 dark:bg-primary/10 rounded-full"></div>
<!-- Icon Composition: Wrench + Disconnected Signal -->
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[120px] mb-2" style="font-variation-settings: 'FILL' 1;">
                        build
                    </span>
<div class="absolute -top-2 -right-2 bg-background-light dark:bg-background-dark p-2 rounded-full">
<span class="material-symbols-outlined text-primary text-5xl">
                            wifi_off
                        </span>
</div>
</div>
</div>
<!-- Typography Block -->
<div class="flex flex-col items-center gap-3">
<h2 class="text-[#0d131c] dark:text-white text-2xl font-bold leading-tight tracking-[-0.015em] text-center">
                    Bağlantı Sorunu
                </h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed text-center max-w-[320px]">
                    Sunucuyla bağlantı kurulamadı. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.
                </p>
</div>
<!-- Action Buttons Container -->
<div class="w-full flex flex-col gap-3 mt-4">
<!-- Primary Action Button: Tekrar Dene -->
<button class="w-full flex cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] active:scale-[0.98] transition-transform duration-100 shadow-lg shadow-primary/20">
<span class="truncate">Tekrar Dene</span>
</button>
<!-- Secondary Action: İnternet Ayarlarını Kontrol Et -->
<button class="w-full flex cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-6 bg-transparent text-primary dark:text-primary text-sm font-semibold leading-normal tracking-[0.015em] border border-primary/20 hover:bg-primary/5">
<span class="truncate">İnternet Ayarlarını Kontrol Et</span>
</button>
</div>
</div>
</main>
<!-- Bottom Padding for iOS Home Indicator -->
<footer class="h-10 bg-background-light dark:bg-background-dark"></footer>
</body></html>
