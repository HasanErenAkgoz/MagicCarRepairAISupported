<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#3c83f6",
              "background-light": "#f5f7f8",
              "background-dark": "#101722",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-white min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 flex items-center bg-background-light dark:bg-background-dark p-4 border-b border-gray-200 dark:border-gray-800">
<div class="text-gray-900 dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Yeni İş Emri</h2>
</header>
<main class="flex-1 overflow-y-auto">
<!-- PageIndicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-6">
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
<div class="h-2 w-8 rounded-full bg-primary"></div>
</div>
<!-- HeadlineText -->
<div class="px-4">
<h3 class="text-gray-900 dark:text-white tracking-light text-2xl font-bold leading-tight pb-2">Adım 3: Ekspertiz Fotoğrafları</h3>
<!-- BodyText -->
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal pb-6">Lütfen aracın dört yanından ve hasarlı bölgelerinden fotoğraf ekleyin.</p>
</div>
<!-- ButtonGroup (Action buttons) -->
<div class="flex justify-center mb-8">
<div class="flex flex-1 gap-3 max-w-[480px] flex-col items-stretch px-4">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] w-full shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">photo_camera</span>
<span class="truncate">Kamera Aç</span>
</button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-xl h-14 px-5 bg-gray-200 dark:bg-gray-800 text-gray-900 dark:text-white text-base font-bold leading-normal tracking-[0.015em] w-full border border-gray-300 dark:border-gray-700">
<span class="material-symbols-outlined">upload_file</span>
<span class="truncate">Galeriden Yükle</span>
</button>
</div>
</div>
<!-- Photo Grid (3-column) -->
<div class="px-4 grid grid-cols-3 gap-3 mb-8">
<!-- Photo Item 1 -->
<div class="relative aspect-square">
<img class="w-full h-full object-cover rounded-lg border border-gray-200 dark:border-gray-700" data-alt="Close up of a car headlight damage" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9OM4kdX4EllELyr2lpw4JYK5jX8F1f_BZXn4tffGYfY4jAKS4p3sGWfkt03SN19CrgCWUNkijT00WtcjXXoeHPZvciiEyuzuBCW52il82NRc05g4bTu4DafcImOXAgEfYQHsKsHmM_ypZGqduhquwcrJX5xLZO8sMrj1pTdzd5bcws0Xyvj-mdUD8pGyJF1wd-VkCK4bzTMYwJLKUkdGFpqcxd9U0yLFro7hvjLbblw5dZCjRyJndoEmtoUREOSzv0jUa3uhmsJlH"/>
<button class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Photo Item 2 -->
<div class="relative aspect-square">
<img class="w-full h-full object-cover rounded-lg border border-gray-200 dark:border-gray-700" data-alt="Front view of a dark luxury sedan" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaVWEzzB18sGTHhfNQP3-lT-TYI9JNd3HCrW7x_MPjEuXgoxVZgp3XcFXdU3o-3Wp2qZ1RVyhzRze6xCNqjNX6B0-Zt_fWZmSs4-uCrZqdvk0KTTmnj92ujGomudvLJ9chs0sHxcamsqvi6QPupazT1TcDE5BlOlWJqDpYhJMbOp1zSK-B-qD5uSax5B2SuKI38hOXioQd2ndxi3wJct-TDTe9H00Z_wW7yP0nEY-KmdnsnWjq_9AXWhFUPzkfUEGsjCxKWXz7CQV0"/>
<button class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Photo Item 3 -->
<div class="relative aspect-square">
<img class="w-full h-full object-cover rounded-lg border border-gray-200 dark:border-gray-700" data-alt="Rear view of a vehicle showing license plate area" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdLLrIiy8lz6wHQ7F55S7cGsCHjURmXdFR8JWnH9zFRaClORHkvF2qlCXzRI0_JAyd-RTvMDnxWB0VxfpZZU12-rEHp4fFFbY5zQv7rrUfNFmDd3YtTFT5oCf5ndf9kc1M-wU_wAarncAWqeNOs7QGEWx1VCYwiwtPjiZpsbGJarllZVjQcQlVKcV3GOnWzjE0wlzkO3FWovXSr2ofEydncdKaI-GKeXZBrwRt77lYozYSE7wmf1W7wXS7qSi6hmCZdu3a1BSgz9KR"/>
<button class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Empty State Grid Item -->
<div class="aspect-square flex flex-col items-center justify-center border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-lg bg-gray-100 dark:bg-gray-800/50">
<span class="material-symbols-outlined text-gray-400">add_a_photo</span>
</div>
</div>
<!-- Optional Description Fields -->
<div class="px-4 space-y-4 mb-24">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-gray-600 dark:text-gray-400">Hasar Notu (Opsiyonel)</label>
<textarea class="w-full rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white p-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="Gözlemlenen hasarları buraya not alabilirsiniz..." rows="3"></textarea>
</div>
</div>
</main>
<!-- Final Sticky Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-800">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] w-full shadow-lg shadow-primary/40">
<span class="truncate">İş Emrini Oluştur</span>
</button>
<!-- Safe area for iOS -->
<div class="h-4"></div>
</div>
</body></html>
