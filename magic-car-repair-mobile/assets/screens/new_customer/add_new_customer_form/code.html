<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yeni Müşteri Ekle</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3c83f6",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        input:focus {
            border-color: #3c83f6 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 ios-blur border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center justify-between px-4 py-3">
<button class="text-primary font-medium text-base">Vazgeç</button>
<h1 class="text-lg font-bold tracking-tight">Yeni Müşteri</h1>
<div class="w-12"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="max-w-md mx-auto pb-32">
<!-- Profile Header Component -->
<div class="flex p-6 @container">
<div class="flex w-full flex-col gap-4 items-center">
<div class="flex gap-4 flex-col items-center">
<div class="relative group cursor-pointer">
<div class="bg-slate-200 dark:bg-slate-800 bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-4 border-slate-100 dark:border-slate-800 flex items-center justify-center overflow-hidden" data-alt="Müşteri profil fotoğrafı önizleme alanı" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA2sPlWEKod0NDUaggKpevN5HduopIoVKc_KXgkNB0UjrzMXwsOkLQAfWR-tG4SfClZ85v1S2tRKaRTVsSJzp655QnaEGF4T8eKoUvepHC_avPVr7q1LZI-1CqO6ZaWFlPXx6gyEo2WoTd8N8WzPeSIKNRBVpzaPEx5xv0nnJNDa_2O6qrRsIceZGdz5Awpc5601V_3DG7ld_121PLspeXVJjDfF98wHComi2ahG_dUZPsuFnjWaYESlqybgCX9QC2TkAjoc3esfnc2");'>
<div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white text-3xl">photo_camera</span>
</div>
</div>
<div class="absolute bottom-1 right-1 bg-primary text-white p-1.5 rounded-full shadow-lg border-2 border-background-light dark:border-background-dark">
<span class="material-symbols-outlined text-sm block">add</span>
</div>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-[20px] font-bold leading-tight tracking-tight text-center">Profil Fotoğrafı Ekle</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal text-center mt-1">Müşteri için bir görsel seçin</p>
</div>
</div>
</div>
</div>
<form class="space-y-2">
<!-- Section: Kişisel Bilgiler -->
<div class="px-4">
<h3 class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-widest px-1 pb-3">Kişisel Bilgiler</h3>
<div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 divide-y divide-slate-200 dark:divide-slate-800">
<!-- Ad -->
<div class="flex items-center px-4 py-3 gap-4">
<span class="material-symbols-outlined text-slate-400 text-xl">person</span>
<div class="flex-1">
<p class="text-xs font-semibold text-primary/80 uppercase">Ad</p>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-base placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Müşterinin adı" type="text"/>
</div>
</div>
<!-- Soyad -->
<div class="flex items-center px-4 py-3 gap-4">
<span class="material-symbols-outlined text-slate-400 text-xl opacity-0">person</span>
<div class="flex-1">
<p class="text-xs font-semibold text-primary/80 uppercase">Soyad</p>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-base placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Müşterinin soyadı" type="text"/>
</div>
</div>
<!-- TC Kimlik No -->
<div class="flex items-center px-4 py-3 gap-4">
<span class="material-symbols-outlined text-slate-400 text-xl">badge</span>
<div class="flex-1">
<p class="text-xs font-semibold text-primary/80 uppercase">TC Kimlik No</p>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-base placeholder:text-slate-400 dark:placeholder:text-slate-600 [appearance:textfield] [&amp;::-webkit-outer-spin-button]:appearance-none [&amp;::-webkit-inner-spin-button]:appearance-none" placeholder="11 haneli kimlik numarası" type="number"/>
</div>
</div>
</div>
</div>
<!-- Section: İletişim Bilgileri -->
<div class="px-4 pt-6">
<h3 class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-widest px-1 pb-3">İletişim Bilgileri</h3>
<div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 divide-y divide-slate-200 dark:divide-slate-800">
<!-- Telefon -->
<div class="flex items-center px-4 py-3 gap-4">
<span class="material-symbols-outlined text-slate-400 text-xl">call</span>
<div class="flex-1">
<p class="text-xs font-semibold text-primary/80 uppercase">Telefon</p>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-base placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="0 (5xx) xxx xx xx" type="tel"/>
</div>
</div>
<!-- E-posta -->
<div class="flex items-center px-4 py-3 gap-4">
<span class="material-symbols-outlined text-slate-400 text-xl">mail</span>
<div class="flex-1">
<p class="text-xs font-semibold text-primary/80 uppercase">E-posta</p>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-base placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="ornek@mail.com" type="email"/>
</div>
</div>
<!-- Adres -->
<div class="flex items-start px-4 py-3 gap-4">
<span class="material-symbols-outlined text-slate-400 text-xl mt-1">location_on</span>
<div class="flex-1">
<p class="text-xs font-semibold text-primary/80 uppercase">Adres</p>
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 text-base placeholder:text-slate-400 dark:placeholder:text-slate-600 resize-none" placeholder="Mahalle, cadde, no..." rows="2"></textarea>
</div>
</div>
</div>
</div>
<!-- VIP Toggle Section -->
<div class="px-4 pt-6">
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 px-4 py-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary">workspace_premium</span>
</div>
<div>
<p class="text-base font-bold">VIP Müşteri</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Özel hizmet ve indirim statüsü</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-12 h-6 bg-slate-200 dark:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</form>
</main>
<!-- Footer Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/95 dark:via-background-dark/95 to-transparent">
<div class="max-w-md mx-auto">
<button class="w-full bg-gradient-to-r from-primary to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined">person_add</span>
                Müşteriyi Kaydet
            </button>
<!-- Safe area bottom spacer -->
<div class="h-4"></div>
</div>
</div>
</body></html>
